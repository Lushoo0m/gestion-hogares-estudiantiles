<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gestión Hogares Estudiantiles</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#10151a" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hogares" />
</head>
<body>
  <header>
    <h1>Gestión Hogares Estudiantiles</h1>
    <p>Registro de gastos — Hogar Colonia</p>
  </header>
  <main>
    <div id="selector-hogares"></div>
    <div id="selector-meses"></div>
    <section id="estado-cuenta"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.error('No se pudo registrar el service worker (la app sigue funcionando online):', err);
        });
      });
    }
  </script>
</body>
</html>
